<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero B — prueba · Sebastián Mogordoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#ff5230;--ink:#f4f1ea}
html,body{background:#0c0c0d;color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
.note{position:fixed;top:0;left:0;right:0;z-index:20;background:#16110f;border-bottom:1px solid rgba(255,82,48,.4);color:#e7d9d2;font-size:12px;letter-spacing:.04em;text-align:center;padding:8px 14px}
.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;overflow:hidden}
.bgvid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;border:0;pointer-events:none;z-index:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center 42%;filter:contrast(1.03) saturate(1.06);z-index:0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,13,.55) 0%,rgba(12,12,13,.2) 34%,rgba(12,12,13,.5) 60%,rgba(12,12,13,.9) 82%,#0c0c0d 100%);z-index:1}
.inner{position:relative;z-index:2;width:100%;max-width:1180px;margin:0 auto;padding:0 32px 64px;text-align:center}
.col{display:inline-block;text-align:center}
.herometa{margin-bottom:2px;text-align:left;padding-left:6px}
.imdb-btn img{height:26px;width:auto;display:inline-block}
.kicker{font-size:clamp(13px,1.5vw,17px);font-weight:500;color:#efece4;border-left:3px solid var(--accent);padding-left:14px;max-width:540px;line-height:1.45;margin-bottom:26px}
.hero h1{font-family:'Archivo Black';font-weight:400;font-size:clamp(46px,12vw,150px);line-height:.82;letter-spacing:-.015em;text-transform:uppercase}
.roles{font-family:'Archivo Black';font-weight:400;text-transform:uppercase;font-size:clamp(13px,1.7vw,21px);letter-spacing:.06em;color:var(--accent);margin-top:18px}
.tag{font-size:clamp(14px,1.6vw,18px);color:#cfcabf;margin-top:12px}
.cta{margin-top:30px;display:flex;gap:13px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:2px;font-family:'Archivo Black';font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.2s}
.btn.fill{background:var(--accent);color:#1a0a05}
.btn.line{border:1px solid rgba(244,241,234,.25);color:var(--ink)}
.switch{position:absolute;z-index:3;right:24px;bottom:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.switch button{background:rgba(12,12,13,.6);backdrop-filter:blur(4px);border:1px solid rgba(244,241,234,.22);color:#cfcabf;font-family:'Inter';font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;border-radius:3px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.switch button.on{border-color:var(--accent);color:#fff}
.switch button:hover{color:#fff}
@media(max-width:640px){
  .inner{padding:0 20px 48px}
  .switch{left:20px;right:20px;justify-content:center;bottom:14px}
  .kicker{margin-bottom:18px}
}
</style>
</head>
<body>
<div class="note">Versión de PRUEBA del hero (no enlazada). — <a href="https://www.sebastianmogordoy.com" style="color:#ff5230">ver home actual</a></div>
<header class="hero">
  <iframe id="heroVid" class="bgvid" allow="autoplay; fullscreen" title="Reel" style="display:none"></iframe>
  <div class="bg" id="heroBg" style="display:none"></div>
  <div class="inner"><div class="col">
    <div class="herometa"><a class="imdb-btn" href="https://www.imdb.com/name/nm3361869/" target="_blank" rel="noopener" aria-label="Ver perfil en IMDb"><img src="assets/logos/imdb.png" alt="IMDb"></a></div>
    <h1>Sebastián<br>Mogordoy</h1>
    <p class="tag">Treinta años en escena, entre Buenos Aires y Barcelona.</p>
    <div class="cta">
      <a class="btn fill" href="#" onclick="go('reel');return false">&#9654;&nbsp; Ver reel</a>
      <a class="btn line" href="#">Contratación</a>
    </div>
   </div></div>
  <div class="switch" id="sw">
    <button data-mode="reel">&#9654; Reel</button>
    <button data-mode="retrato">Retrato</button>
    <button data-mode="euforia">Euforia</button>
  </div>
<script>
var vid=document.getElementById('heroVid'),bg=document.getElementById('heroBg'),sw=document.getElementById('sw');
var btns=[].slice.call(sw.querySelectorAll('button'));
var euforia=[
 {i:'assets/photos/euforia1.jpg',p:'60% 32%',z:1.05},
 {i:'assets/photos/euforia2.jpg',p:'48% 36%',z:1.12},
 {i:'assets/photos/euforia3.jpg',p:'63% 40%',z:1.55},
 {i:'assets/photos/euforia4.jpg',p:'58% 42%',z:1.15},
 {i:'assets/photos/euforia5.jpg',p:'37% 40%',z:1.4},
 {i:'assets/photos/euforia6.jpg',p:'55% 38%',z:1.25}
];
var timer=null, ei=0;
function mark(mode){btns.forEach(function(b){b.classList.toggle('on',b.dataset.mode===mode);});}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function setImg(src,pos,z){vid.style.display='none';bg.style.backgroundImage="url('"+src+"')";bg.style.backgroundPosition=pos;bg.style.transformOrigin=pos;bg.style.transform='scale('+(z||1)+')';bg.style.display='block';}
function showReel(){stopTimer();bg.style.transform='none';if(!vid.src)vid.src="https://player.vimeo.com/video/624294626?background=1&autoplay=1&loop=1&muted=1&dnt=1";vid.style.display='block';bg.style.display='none';}
function showRetrato(){stopTimer();setImg('assets/photos/bio_03.jpg','center 42%',1);}
function showEuforia(){stopTimer();ei=0;setImg(euforia[0].i,euforia[0].p,euforia[0].z);timer=setInterval(function(){ei=(ei+1)%euforia.length;setImg(euforia[ei].i,euforia[ei].p,euforia[ei].z);},4200);}
function go(mode){mark(mode);if(mode==='reel')showReel();else if(mode==='retrato')showRetrato();else showEuforia();}
sw.addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.mode);});
(function(){var pool=['reel','reel','reel','reel','reel','euforia','euforia','euforia','retrato'];go(pool[Math.floor(Math.random()*pool.length)]);})();
</script>
</header>
</body>
</html>
