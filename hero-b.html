<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero B — prueba · Sebastián Mogordoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#ff5230;--ink:#f4f1ea}
html,body{background:#0c0c0d;color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
.note{position:fixed;top:0;left:0;right:0;z-index:20;background:#16110f;border-bottom:1px solid rgba(255,82,48,.4);color:#e7d9d2;font-size:12px;letter-spacing:.04em;text-align:center;padding:8px 14px}
.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center 28%;filter:grayscale(1) contrast(1.18) brightness(.92);transition:background-image .4s ease, opacity .4s ease}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,13,.55) 0%,rgba(12,12,13,.2) 34%,rgba(12,12,13,.5) 60%,rgba(12,12,13,.9) 82%,#0c0c0d 100%);z-index:1}
.inner{position:relative;z-index:2;width:100%;max-width:1180px;margin:0 auto;padding:0 32px 64px}
.kicker{font-family:'Inter';font-size:clamp(13px,1.5vw,17px);font-weight:500;letter-spacing:.01em;color:#efece4;border-left:3px solid var(--accent);padding-left:14px;max-width:540px;line-height:1.45;margin-bottom:26px}
.hero h1{font-family:'Archivo Black';font-weight:400;font-size:clamp(46px,12vw,150px);line-height:.82;letter-spacing:-.015em;text-transform:uppercase}
.roles{font-family:'Archivo Black';font-weight:400;text-transform:uppercase;font-size:clamp(13px,1.7vw,21px);letter-spacing:.06em;color:var(--accent);margin-top:18px}
.tag{font-size:clamp(14px,1.6vw,18px);color:#cfcabf;margin-top:12px}
.cta{margin-top:30px;display:flex;gap:13px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:2px;font-family:'Archivo Black';font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.2s}
.btn.fill{background:var(--accent);color:#1a0a05}
.btn.line{border:1px solid rgba(244,241,234,.25);color:var(--ink)}
.switch{position:absolute;z-index:3;right:24px;bottom:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.switch button{background:rgba(12,12,13,.6);backdrop-filter:blur(4px);border:1px solid rgba(244,241,234,.22);color:#cfcabf;font-family:'Inter';font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;border-radius:3px;cursor:pointer;transition:.2s}
.switch button.on{border-color:var(--accent);color:#fff}
.switch button:hover{color:#fff}
@media(max-width:640px){
  .inner{padding:0 20px 48px}
  .switch{left:20px;right:20px;justify-content:center;bottom:14px}
  .kicker{margin-bottom:18px}
}
</style>
</head>
<body>
<div class="note">Versión de PRUEBA del hero (no enlazada). Comparala con la home actual. — <a href="https://www.sebastianmogordoy.com" style="color:#ff5230">ver home actual</a></div>
<header class="hero">
  <div class="bg" id="heroBg" style="background-image:url('assets/photos/bio_03.jpg')"></div>
  <div class="inner">
    <p class="kicker">Si no te quema la sangre, no es teatro: es mentira.</p>
    <h1>Sebastián<br>Mogordoy</h1>
    <p class="roles">Actor · Director · Pedagogo teatral</p>
    <p class="tag">Treinta años en escena, entre Buenos Aires y Barcelona.</p>
    <div class="cta">
      <a class="btn fill" href="#">&#9654;&nbsp; Ver reel</a>
      <a class="btn line" href="#">Contratación</a>
    </div>
  </div>
  <div class="switch" id="sw">
    <button data-img="assets/photos/bio_03.jpg" class="on">La mirada</button>
    <button data-img="assets/photos/bloque_dos_euforia_2.jpg">Euforia</button>
    <button data-img="assets/photos/bloque_dos_elfill_1.jpg">El Fill</button>
    <button data-img="assets/photos/bloque_dos_corazonada_1.jpg">La corazonada</button>
  </div>
</header>
<script>
var bg=document.getElementById('heroBg');
document.getElementById('sw').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  bg.style.backgroundImage="url('"+b.dataset.img+"')";
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('on')});
  b.classList.add('on');
});
</script>
</body>
</html>
